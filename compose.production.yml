# Standalone public deployment; do not combine with compose.yml.
# Separate name/volumes prevent reuse of local test credentials and data.
name: testtask-public
services:
  proxy:
    image: testtask-caddy-hardened
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
      proxy:
        ipv4_address: 172.30.90.2
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__ApiKeyFile: /run/secrets/api_key
      Security__TrustedProxy: 172.30.90.2
      Security__AllowedHosts: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
      ConnectionStrings__PostgresFile: /run/secrets/api_connection
    secrets: [api_key, api_connection]
    networks:
      proxy:
        ipv4_address: 172.30.90.3
      database:
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: testtask-postgres-hardened
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: testtask
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_admin_password, db_app_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testtask"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.90.0/24
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  api_key:
    file: ./.secrets/api_key
  api_connection:
    file: ./.secrets/api_connection
  db_admin_password:
    file: ./.secrets/db_admin_password
  db_app_password:
    file: ./.secrets/db_app_password
