# Only for isolated local verification of the production configuration.
services:
  proxy:
    environment:
      PUBLIC_DOMAIN: localhost
    ports: !override
      - "127.0.0.1:9080:80"
      - "127.0.0.1:9443:443"
secrets:
  api_key:
    file: ./TestResults/security/.secrets/api_key
  api_connection:
    file: ./TestResults/security/.secrets/api_connection
  db_admin_password:
    file: ./TestResults/security/.secrets/db_admin_password
  db_app_password:
    file: ./TestResults/security/.secrets/db_app_password
